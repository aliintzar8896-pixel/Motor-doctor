services:
  # Option 1: Unified Production Web Service (Serves both API and Frontend SPA)
  - type: web
    name: motor-doctor-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://motordoctor.in,https://motor-doctor-app.onrender.com

